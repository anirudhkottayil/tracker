<text x="680" y="220" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="22" fill="#6B7080">24%</text>
<text x="106" y="256" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="26" font-weight="700" fill="#E8A33D">&#10095;</text>
