<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>tracker — a synced CLI time tracker</title>
<desc>A stylized terminal window running "tracker --today --graph" and printing a two-row bar graph of time spent on c-project and job-search, with a large ghosted clock face in the background.</desc>
<rect width="1200" height="320" fill="#14161C"/>
<circle cx="980" cy="160" r="210" fill="none" stroke="#EDEAE3" stroke-width="14" opacity="0.05"/>
<line x1="980" y1="160" x2="980" y2="40" stroke="#EDEAE3" stroke-width="14" opacity="0.05" stroke-linecap="round"/>
<line x1="980" y1="160" x2="1078" y2="160" stroke="#EDEAE3" stroke-width="14" opacity="0.05" stroke-linecap="round"/>
<rect x="70" y="48" width="1060" height="224" rx="14" fill="#1B1E27" stroke="#2A2E3A" stroke-width="1.5"/>
<path d="M 84 48 h 1032 a 14 14 0 0 1 14 14 v 24 h -1060 v -24 a 14 14 0 0 1 14 -14 z" fill="#20232E"/>
<line x1="70" y1="86" x2="1130" y2="86" stroke="#2A2E3A" stroke-width="1"/>
<circle cx="106" cy="67" r="6" fill="#3A3E4B"/>
<circle cx="128" cy="67" r="6" fill="#3A3E4B"/>
<circle cx="150" cy="67" r="6" fill="#3A3E4B"/>
<text x="600" y="72" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="14" fill="#6B7080">tracker — zsh</text>
<text x="106" y="146" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="26" font-weight="700" fill="#E8A33D">&#10095;</text>
<text x="138" y="146" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="26" font-weight="700" fill="#EDEAE3"> tracker --today --graph</text>
<text x="106" y="188" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="22" fill="#4FB6A8">c-project</text>
<text x="340" y="188" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="22" fill="#4FB6A8">████████████████░░░░</text>
<text x="680" y="188" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, monospace" font-size="22" fill="#6B7080">76%</text>
